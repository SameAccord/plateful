# Every field added here that a mod metadata file uses must also be added to the
# expandProps map in build-logic/src/main/groovy/multiloader-common.gradle.

# Project
version=1.0.0
group=com.sameaccord.plateful
java_version=25

# Common
minecraft_version=26.3
mod_name=Plateful
mod_author=SameAccord
mod_id=plateful
license=MIT
credits=
description=Adds over 30 foods, rice, lettuce and tomato crops, a cheese vat and a Food Journal.
minecraft_version_range=[26.3, 26.4)
## Minecraft version the 'common' project compiles against, see https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Loader versions.
# These are deliberately the *oldest* builds for Minecraft 26.3 (not the newest), so the mod is compiled
# against the oldest APIs and runs on every newer build too. The jars declare these as minimums.
#   Fabric API 0.160.6 is the first build made after the 26.3 release; it requires Fabric Loader 0.19.3.
#   NeoForge 26.3.0.0-beta is the first NeoForge build for 26.3.
fabric_version=0.160.6+26.3
fabric_loader_version=0.19.3
neoforge_version=26.3.0.0-beta
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
